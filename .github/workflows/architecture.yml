name: Agent architecture boundary
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Enforce neutral production and documented interfaces
        run: |
          python3 -B scripts/checks/neutrality.py
          python3 -B scripts/checks/runtime_assets.py --check
          python3 -B scripts/checks/public_api.py
          python3 -B -m unittest discover -s tests/tooling -p 'test_neutrality.py'
          python3 -B -m unittest discover -s sdk/python/tests -p 'test_admission.py'
          python3 -B -m unittest discover -s sdk/python/tests -p 'test_runtime_files.py'
          go test ./internal/agent -run '^TestAssignmentsRequireCanonicalPackageSubjects$' -count=1
