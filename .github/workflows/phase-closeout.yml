name: Agent phase closeout
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verification label
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: phase-closeout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Prepare Debian verification environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git passwd python3 systemd util-linux
          useradd --create-home --uid 1001 --user-group tinywarden-ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install phase-end scanners
        run: |
          GOBIN=/usr/local/bin go install github.com/zricethezav/gitleaks/v8@v8.30.1
          GOBIN=/usr/local/bin go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Verify this exact commit
        run: |
          chown -R tinywarden-ci:tinywarden-ci "$GITHUB_WORKSPACE"
          runuser --user tinywarden-ci -- ./scripts/verify.sh --phase-end
